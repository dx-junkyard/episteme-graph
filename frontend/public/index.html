<!DOCTYPE html>
<!-- .learn-page: 学習画面は1画面に収める（ページ自体をスクロールさせない）。
     styles.css の html.learn-page ルール参照。admin.html には付けない。 -->
<html lang="ja" class="learn-page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Episteme Graph — 学習支援</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <!-- ?v=: レイアウト（1画面に収める）系の修正は CSS が古いままだと効かないので、
       atlas.css と同じくバージョンクエリでキャッシュを切る。 -->
  <link rel="stylesheet" href="/css/styles.css?v=knowledge-landscape-20260804">
  <link rel="stylesheet" href="/css/atlas.css?v=knowledge-landscape-20260804">
</head>
<body>
  <div class="app">
    <!-- Top Bar -->
    <div class="topbar">
      <div class="topbar-l">
        <span class="logo">Episteme Graph</span>
        <span class="sep">/</span>
        <select class="course-select" id="course-select">
          <option value="">読み込み中...</option>
        </select>
      </div>
      <div class="topbar-r">
        <span id="streak" style="color:var(--color-text-success)"></span>
        <span style="opacity:.3">|</span>
        <button id="groups-btn" style="background:none;border:none;color:var(--color-text-secondary);cursor:pointer;font-size:12px;font-family:inherit" title="グループ管理">グループ <span id="groups-badge" style="display:none;background:var(--color-text-danger,#e53935);color:#fff;border-radius:8px;padding:1px 6px;margin-left:2px;font-size:10px">0</span></button>
        <span style="opacity:.3">|</span>
        <button id="atlas-btn" data-ui-anchor="topbar.atlas" style="background:none;border:none;color:var(--color-text-secondary);cursor:pointer;font-size:12px;font-family:inherit" title="分野の地図を開く">地図</button>
        <span style="opacity:.3">|</span>
        <button id="my-map-btn" data-ui-anchor="topbar.my-map" style="background:none;border:none;color:var(--color-text-secondary);cursor:pointer;font-size:12px;font-family:inherit" title="わたしの地図を開く">わたしの地図</button>
        <span style="opacity:.3">|</span>
        <!-- 主権台帳 v1（trace_registry_sovereignty_ledger_design.md §3.4）:
             本人の全痕跡の一覧と持ち出し。パネル本体は my-records.js が遅延生成する。 -->
        <button id="my-records-btn" data-ui-anchor="topbar.my-records" style="background:none;border:none;color:var(--color-text-secondary);cursor:pointer;font-size:12px;font-family:inherit" title="わたしの記録を開く">わたしの記録</button>
        <span style="opacity:.3">|</span>
        <!-- 学習UI再編 Phase 1（§4）: composer から画面全体トグルの定位置＝トップバーへ移設。
             ID・typed action 配線（support_action="usage_help"）は不変。
             Phase 2: 押下は「使い方インスペクト・モード」の ON/OFF トグルになった
             （旧・押下即送信の typed action 送信は composer/音声側の発話経路へ移設。§4）。 -->
        <button id="help-usage-btn" class="help-usage-btn" data-ui-anchor="topbar.inspect" style="background:none;border:none;color:var(--color-text-secondary);cursor:pointer;font-size:12px;font-family:inherit" title="この画面の使い方インスペクト・モードを ON/OFF（ON中は部品にカーソルを合わせると説明が出ます）">❓ 使い方</button>
        <span style="opacity:.3">|</span>
        <span id="username"></span>
        <button id="logout-btn" style="background:none;border:none;color:var(--color-text-secondary);cursor:pointer;font-size:12px;font-family:inherit">ログアウト</button>
      </div>
    </div>

    <!-- インスペクト・モード常設バナー（学習UI再編 Phase 2, §4）。既定 hidden。
         クリックは解除のみ（IH4） — バナー自体の中では通常のクリックを許可する。 -->
    <div class="inspect-banner" id="inspect-banner" hidden>使い方を確認中 — 知りたい部分にカーソルを合わせてください（Esc で終了）</div>
    <!-- インスペクト・ツールチップ容器（§5.2〜5.4）。JS が innerHTML と位置を都度書き換える。 -->
    <div class="inspect-tooltip" id="inspect-tooltip" hidden></div>
    <!-- 欄外の印のツールチップ容器（return_door_design.md §2.3）。本人の言葉の逐語のみを
         app.js が textContent で書き込む（RD1。innerHTML は使わない）。 -->
    <div class="margin-marks-tip" id="margin-marks-tip" hidden></div>

    <!-- Sidebar -->
    <div class="sb" id="sidebar">
      <div class="sb-hd">学習パス</div>
    </div>

    <!-- Main Chat Area -->
    <div class="mn">
      <!-- 帰還の扉（再入口インレイ, docs/features/return_door_design.md §2.1）:
           本人の書き置き・持ち越しの問い・最後に確定した引っかかりの逐語のみを表示する
           （RD1: AI要約ゼロ）。empty なら描画しない・経過日数は出さない（RD2/RD5）。
           描画は app.js の renderReturnDoor が textContent でのみ行う。
           flex: 0 0 auto の薄い1区画（上段 .material-region の圧縮規約を壊さない）。 -->
      <div class="return-door" id="return-door" data-ui-anchor="material.return-door" hidden></div>
      <!-- 教材区画（本筋・順路）: 教材本文＋確認して次へ。会話で流れない独立スクロール -->
      <div class="material-region" id="material-region">
        <!-- 教材区画ヘッダ（②提示形式, §3.2）: 左=「教材 · トピック名」/ 右=提示形式
             セグメント [📖 読む|🎙 講義]。discuss モード中はセグメントごと隠す
             （教材区画がプレースホルダに変わるため）。全画面ボタンは講義中のみ表示。 -->
        <div class="material-header" id="material-header">
          <span class="material-header-title" id="material-header-title">教材</span>
          <button id="discuss-opening-toggle" class="discuss-opening-toggle" type="button" hidden aria-expanded="false">開く</button>
          <div class="material-format-toggle" id="material-format-toggle">
            <button type="button" class="material-format-opt active" id="material-format-read" title="教材を通常表示で読む">📖 読む</button>
            <button type="button" class="material-format-opt" id="lecture-toggle" data-ui-anchor="material.lecture-toggle" title="レクチャーモード切替">🎙 講義</button>
            <span class="lecture-toggle-hint" id="lecture-toggle-hint" hidden></span>
          </div>
          <!-- 欄外の印の表示トグル（return_door_design.md §2.3）: 状態は localStorage
               eg_margin_marks:<courseId>（精読モードと同型の許容例外）。既定は表示 ON。 -->
          <button type="button" class="margin-marks-toggle" id="margin-marks-toggle" aria-pressed="true" title="欄外の印（あなたが確定した引っかかり・問いの点）の表示/非表示" hidden>●印</button>
          <button type="button" class="lecture-fullscreen-btn" id="lecture-fullscreen-btn" title="スライドを全画面表示" hidden>⛶ 全画面</button>
        </div>
        <div class="material-body" id="material-body"></div>
        <!-- 欄外の印（return_door_design.md §2.3）: 教材区画の右余白に本人の確定痕跡を
             淡い点で縦に並べる薄いレイヤ。描画は app.js の renderMarginMarks が
             textContent でのみ行う（数を表示しない・map_excluded は出さない）。 -->
        <div class="margin-marks" id="margin-marks" hidden></div>
        <div class="material-foot">
          <!-- 理解サイクル Phase 1（ANCHOR, docs/features/understanding_cycle_design.md
               §5.4）: 常設の軽量アンカー4ボタン。テキスト選択時のポップオーバーとは別に、
               選択なしでも押せる導線として置く。コース・トピック選択時のみ表示する。 -->
          <div class="quick-anchor-strip" id="quick-anchor-strip" data-ui-anchor="material.quick-anchor" hidden>
            <button type="button" class="quick-anchor-btn" data-quick-anchor="curious">気になる</button>
            <button type="button" class="quick-anchor-btn" data-quick-anchor="not_yet">まだ分からない</button>
            <button type="button" class="quick-anchor-btn" data-quick-anchor="return_later">あとで戻る</button>
            <button type="button" class="quick-anchor-btn" data-quick-anchor="connects">何かとつながりそう</button>
          </div>
          <button class="next-topic-btn" id="next-topic-btn" data-ui-anchor="material.next-topic" style="display:none" title="次のトピックへ進む">確認して次へ</button>
        </div>
        <!-- 再構成ループ (R層): 「再構成に挑戦」導線。自動では開かない（本人が開く） -->
        <div class="reconstruction-region" id="reconstruction-region" hidden></div>
      </div>
      <!-- 分割ハンドル: 教材区画と下段（読み上げ行＋ホワイトボード）の比率をドラッグで調整 -->
      <div class="split-handle" id="split-handle" title="ドラッグして教材の表示比率を調整"><span class="split-grip"></span></div>
      <!-- チャット区画（探索）: モードバー＋会話 -->
      <div class="mode-bar" id="mode-bar" hidden></div>
      <div class="ca" id="chat-area">
        <div class="mg ai" style="color:var(--color-text-tertiary)">
          トピックを選択して学習を始めましょう。
        </div>
      </div>
      <!-- レクチャースライドステージ: 表示と読み上げの同期最小単位（スライド）を1枚だけ表示する。
           レクチャーモード中は #material-region の代わりにこちらを表示し、縦スクロールはさせない
           （収まらない場合はフォント段階縮小 → 等比縮小で全文を収める）。 -->
      <div class="lecture-slide-stage" id="lecture-slide-stage">
        <div class="lecture-slide-inner" id="lecture-slide-inner"></div>
        <span class="lecture-slide-badge" id="lecture-slide-noaudio" hidden>&#128263; 音声未生成</span>
        <div class="lecture-slide-notice" id="lecture-slide-notice" hidden></div>
      </div>
      <!-- Lecture player bar -->
      <div class="lecture-player" id="lecture-player">
        <div class="lecture-controls">
          <button class="lecture-prev-btn" id="lecture-prev" title="前のセグメント">&#9664;</button>
          <button class="lecture-play-btn" id="lecture-play" title="再生">&#9654;</button>
          <div class="lecture-progress-info">
            <span class="lecture-segment-label" id="lecture-segment-label">--</span>
            <div class="lecture-progress-bar"><div class="lecture-progress-fill" id="lecture-progress-fill"></div></div>
          </div>
          <span class="lecture-time" id="lecture-time">0:00</span>
          <button class="lecture-next-btn" id="lecture-next" title="次のセグメント">&#9654;</button>
          <button class="lecture-question-btn" id="lecture-question" title="質問する">&#10067; 質問</button>
        </div>
      </div>
      <!-- discuss モード（論文と話す）Phase 1: スコープ切替。入口はサイドバー二枚看板に一本化
           （常設リンクによる重複導線は学習UI再編 Phase 0 で削除済み）。
           寄り道（explore）とは独立した機構 — 語彙・スタイルとも「寄り道」を使わない。 -->
      <div class="discuss-bar" id="discuss-bar" hidden>
        <span class="discuss-bar-label">🗣 範囲:</span>
        <div class="discuss-scope-toggle" id="discuss-scope-toggle" data-ui-anchor="discuss.scope-toggle">
          <button type="button" class="discuss-scope-opt" data-discuss-scope="course_sources">このコースのソース論文</button>
          <button type="button" class="discuss-scope-opt" data-discuss-scope="all_visible">閲覧できる周辺資料まで</button>
        </div>
        <!-- 理解サイクル Phase 1（精読モード, docs/features/understanding_cycle_design.md
             §4.3/§5.3）: 既定 off。ON でも開幕は自動で変わらず、「予想してから開く」の
             既定表示だけが変わる（OFF でも小さなリンクから入れる）。 -->
        <button type="button" class="lx-filter cycle-precision-toggle" id="cycle-precision-toggle" aria-pressed="false" title="ONにすると、論文を開く前に予想を書く画面が既定で表示されます">精読モード</button>
        <!-- 音声会話の非対応を近傍に事実文で示す（設計 §6.4: 音声版はこのモードの
             非スコープ。app.js の updateVoiceAvailability が hidden を切り替える）。 -->
        <span class="discuss-voice-note" id="discuss-voice-note" hidden>音声会話は「順番に学ぶ」モードで利用できます。</span>
        <!-- Phase 2 着地画面トリガー①（明示終了）。押すと discuss.js が今日の議論を
             振り返る軽量モーダルを提示する（スキップ可・既定オン）。 -->
        <button type="button" class="discuss-end-btn" id="discuss-end-btn" data-ui-anchor="discuss.end" title="今日の議論を振り返って終える">議論を終える</button>
      </div>
      <div class="ia">
        <input type="text" id="chat-input" data-ui-anchor="composer.input" placeholder="質問や考えを入力…（Enterで送信）">
        <button id="send-btn" class="primary" data-ui-anchor="composer.send" title="送信（回答が教材由来か自動で判定し、出典タブと回答欄に表示します）">送信</button>
        <button id="voice-mode-btn" class="voice-mode-btn" data-ui-anchor="composer.voice" title="気軽に話せる先生とハンズフリーで会話" aria-label="音声で話す">🎤 音声で話す</button>
      </div>

      <!-- ハンズフリー音声会話パネル（気軽に話せる先生） -->
      <div class="voice-panel" id="voice-panel">
        <div class="voice-panel-head">
          <span class="voice-panel-title">🤖 気軽に話せる先生</span>
          <span class="voice-status" id="voice-status">準備中…</span>
          <button class="voice-close" id="voice-close" title="音声会話を終了">&times;</button>
        </div>
        <div class="voice-transcript" id="voice-transcript"></div>
        <div class="voice-material" id="voice-material"></div>
      </div>
    </div>

    <!-- Right Panel -->
    <div class="rp">
      <div class="tb" id="tabBar">
        <button class="on" data-tab="context" data-ui-anchor="rightpanel.tab-context">コンテキスト</button>
        <button data-tab="progress" data-ui-anchor="rightpanel.tab-progress">進捗</button>
        <button data-tab="sources" data-ui-anchor="rightpanel.tab-sources">出典</button>
      </div>
      <div class="tp vis" id="tab-context"></div>
      <div class="tp" id="tab-progress"></div>
      <div class="tp" id="tab-sources"></div>
      <details class="rp-collapse">
        <summary>▸ このトピックの操作</summary>
        <div class="rp-danger-zone">
          <button class="chat-clear-btn" id="chat-clear-btn" data-ui-anchor="rightpanel.clear-history" title="このトピックの質疑応答履歴を削除">質疑応答履歴を削除</button>
        </div>
      </details>
    </div>

    <!-- discuss モード（論文と話す）着地画面（Phase 2）: 討議終了時の軽量モーダル。
         スキップ可・既定オン。中身は discuss.js が描画する（既定 hidden）。 -->
    <div class="discuss-landing-overlay" id="discuss-landing-region" hidden></div>
  </div>

  <script src="/js/element-vocab.js?v=element-vocab-20260801-2"></script>
  <!-- ↑ 要素種別の表示名の正本（admin_ux_issues_2026-08-01.md §3.3 Phase 0）。app.js より前に読み込む。 -->
  <script src="/js/element-card.js?v=element-card-20260801-1"></script>
  <!-- ↑ 統一パーツカード（§3.2）の編集不可バリアント。element-vocab.js の後・app.js より前。 -->
  <script src="/js/app.js"></script>
  <script src="/js/atlas-fixture.js"></script>
  <script src="/js/atlas-data.js"></script>
  <script src="/js/atlas-overlay.js?v=field-atlas-20260713-1"></script>
  <script src="/js/atlas-panel.js?v=field-atlas-20260713-1"></script>
  <script src="/js/atlas-report.js"></script>
  <script src="/js/atlas-minimap.js"></script>
  <script src="/js/atlas-cues.js"></script>
  <script src="/js/personal-map.js"></script>
  <script src="/js/personal-map-home.js"></script>
  <script src="/js/my-records.js"></script>
  <!-- 知識ランドスケープ（docs/features/knowledge_landscape_design.md §10.1）:
       地図オーバーレイの「論文の位置」レイヤー + 出典タブへのデータ供給。
       atlas-overlay.js のフックから呼ばれるので personal-map.js の後に読み込む。 -->
  <script src="/js/landscape-layer.js?v=knowledge-landscape-20260804"></script>
  <script src="/js/reconstruction.js"></script>
  <script src="/js/discuss.js"></script>
</body>
</html>
