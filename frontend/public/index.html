<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Episteme Graph – 素粒子物理学 学習チャット</title>

  <!-- KaTeX for LaTeX rendering (Task 4) -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+"
    crossorigin="anonymous"
  />
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
    integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg"
    crossorigin="anonymous"
  ></script>
  <!-- Auto-render extension: scans for $...$ and $$...$$ -->
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRjXnKNOP1kALtQo"
    crossorigin="anonymous"
  ></script>

  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="header">
      <h1>Episteme Graph</h1>
      <span class="subtitle">素粒子物理学 学習チャット</span>
    </header>

    <!-- Chat area -->
    <main id="chat-container">
      <div id="messages"></div>
    </main>

    <!-- Suggest buttons area -->
    <div id="suggest-bar"></div>

    <!-- Input area -->
    <footer id="input-area">
      <form id="chat-form">
        <textarea
          id="user-input"
          placeholder="質問を入力してください…"
          rows="1"
        ></textarea>
        <button type="submit" id="send-btn">送信</button>
      </form>
    </footer>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
