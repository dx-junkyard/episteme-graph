[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "episteme-graph"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["episteme_graph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
