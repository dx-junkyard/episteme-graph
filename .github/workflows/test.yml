name: Tests

on:
  pull_request:
    branches: [ura-dev]
  push:
    branches: [ura-dev]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: episteme
          POSTGRES_PASSWORD: episteme
          POSTGRES_DB: episteme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U episteme -d episteme_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://episteme:episteme@localhost:5432/episteme_test
      EPISTEME_TEST_DATABASE_URL: postgresql://episteme:episteme@localhost:5432/episteme_test
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/api/requirements.txt

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      # 正本は backend/db/*.sql。2 つの実行経路の両方で流す:
      #  1) psql — ファイルが plain SQL として読めること（docker の initdb と同じ経路）と、
      #     フレッシュ DB への番号順全適用を検証する。
      #  2) core/migrations.py::run_migrations() — 本番の起動時経路。psycopg2 の `%` 二重化を
      #     ランナーが行うことと、**2 回目の適用（冪等再実行）**が通ることを検証する。
      # 2026-09-19: psql 経路だけだったため、ファイル側の `%%` 規約（psycopg2 前提）が CI で
      # 078 の RAISE NOTICE を落とした。片方の経路だけで検証しない。
      - name: Apply all migrations with psql (fresh DB, plain SQL)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/init.sql
          for f in $(ls db/[0-9][0-9][0-9]_*.sql | sort); do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Re-apply all migrations with the runtime runner (idempotency + driver path)
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine
          from core.migrations import run_migrations
          applied = run_migrations(engine=create_engine(os.environ["DATABASE_URL"]))
          print(f"re-applied {len(applied)} migration files via run_migrations()")
          PY

      - name: Run backend tests
        run: python -m pytest tests/ -q

      # src/tests（PDF 解析 agent 群）。CLAUDE.md の「テスト実行（全件 / agents）」と同じ経路。
      # 2026-09-19 まで CI に含まれていなかった。
      - name: Run agent tests (src)
        working-directory: src
        run: python -m pytest tests -q
