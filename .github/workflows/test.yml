name: Tests

on:
  pull_request:
    branches: [ura-dev]
  push:
    branches: [ura-dev]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: episteme
          POSTGRES_PASSWORD: episteme
          POSTGRES_DB: episteme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U episteme -d episteme_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://episteme:episteme@localhost:5432/episteme_test
      EPISTEME_TEST_DATABASE_URL: postgresql://episteme:episteme@localhost:5432/episteme_test
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/api/requirements.txt

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      # 正本は backend/db/*.sql（core/migrations.py::run_migrations() が起動時に
      # 番号順に全ファイルを適用するのと同じ手順）。個別ファイルの決め打ちではなく
      # 全件を番号順に流すことで、CI が「フレッシュ DB への番号順全適用」を毎回
      # 実地検証する回帰ゲートになる（2026-07 の main.py インライン DDL 撤去に伴い変更）。
      - name: Initialize PostgreSQL schema (apply all migrations in order)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/init.sql
          for f in $(ls db/[0-9][0-9][0-9]_*.sql | sort); do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run tests
        run: python -m pytest tests/ -v
