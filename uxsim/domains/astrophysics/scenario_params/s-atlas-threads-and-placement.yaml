scenario: s-atlas-threads-and-placement
domain: astrophysics
params:
  goal_text: コースの論文と概念が分野全体の中でどうつながっているかをつかむこと
personas:
  st-05-night-solarwind:
    goal_text: 太陽風の研究がこの分野の地図のどこに置かれ、何とつながっていそうかを夜のうちに確かめること
  st-01-m1-radio:
    # 第 8 周（judge_atlas_r7 §6・IK-1017 の確かめ方の条件）: 足跡を作らずに固定コース 1bad7d9f（pin_course）で、地図にいまここが
    # 無い状態（atlas_footprintless_student）。omitted_note の括弧が「このコースの論文が置かれている場所と…」から始まり、骨格順の
    # 先頭に戻らないこと。同じ周の studio の講義（6be229e1）より前に歩く（face スクリプトの ST01_DONE_R8）
    goal_text: 電波観測の論文が分野のどの領域に置かれているかを確かめること
  st-04-intl-exoplanet:
    goal_text: 系外惑星の研究とこの分野の地図の関係を、AI の推定と確かめられたものに分けてつかむこと
  st-07-m1-grb-voice:
    goal_text: ガンマ線バーストの研究がこの地図のどこに近いかを、文字で読んで確かめること
  st-02-m2-lensing-theory:
    goal_text: 重力レンズの理論がこの地図のどこに置かれ、先生が確かめた位置と AI の推定の位置を読み分けること
  st-06-skeptic-bao:
    # 第 4 周（凍結の後）: 版が上がった地図・採用した関係の糸・見送った関係が糸に出ないこと（審判 B5・RE8）・L1 の霧と配置の一致
    goal_text: BAO の測定がこの地図のどこに置かれているかを、根拠の逐語まで読んで、AI の推定をうのみにせずに確かめること
  st-09-d2-from-datasci:
    # 第 5 周（凍結の後）: 版が上がった地図・反映した関係の糸（審判 B5）・未訪問の札（IK-0964）
    goal_text: データ解析の手法を使う論文がこの地図のどこに置かれ、何とつながっていると推定されているかを、確かめられた位置と分けて読むこと
  st-03-d1-from-particle:
    # 第 6 周（凍結 2026.3 の後・地図の場面は初めて）: 2 回目の版上げで加わった関係が L2 で線として読めるか（IK-0989 —
    # browser runner が無いので API の levels["2"] と omitted_note を読む）・te-02 が見送った関係が糸に出ないこと（RE8）
    goal_text: 素粒子から来た立場で、この分野の地図の版が上がって何がつながったのかを、確かめられた関係と AI の推定に分けて読むこと
    # 第 7 周（judge_atlas_r6 §6）: 足跡のある状態（atlas_footprint_student — 地図に結ばれたトピックで学習チャット 1 問）で、版 2026.4 の
    # 地図。いまここが L1 に出るか・L2 の代表選出がいまここと 1 hop を優先するか（IK-1017 の是正の確かめ。足跡なしの第 6 周との対照）。
    # goal_text は第 6 周と同じ（同じ学生の前後比較）
    # 第 8 周（judge_atlas_r7 §6・IK-1045 の確かめ）: 2026.5 の後に同じ学生・足跡ありで、固定コース 1bad7d9f を H43 の pin_course で
    # 開く（第 7 周は固定外の 6be229e1 を開いた）。2026.3・2026.4 で確定した関係が実線か事実文に出るか。goal_text は第 6・7 周と同じ
