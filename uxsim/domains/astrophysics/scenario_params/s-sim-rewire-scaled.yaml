scenario: s-sim-rewire-scaled
domain: astrophysics
# 第 22 周 (d') st-06（skeptic・BAO）。音速の論文（document 910101fb…）の「GRとMGでの観測量への影響」トピック t17。
# まとまりは第 21 周 (d) と同じ ξ_±（式の本文があり復元式を入力に含まない外枠）。部品は目録の名前（ガウス雑音 / 平均化（N 回））。
# wiring_params の 1 つ目は空（部品の既定値 sigma=0.1 のまま）。2 つ目・3 つ目の sigma は仮の値で、ペルソナが 1 回目の
# 実行で読んだ理論の出力の桁に合わせて置き換える（台本の値は seed — persona/agent.py が非空の自分の値を優先する）。
params:
  goal_text: 観測量の予言が、測定の雑音と平均化でどこまで見分けられるかを、雑音の大きさを予言の桁に合わせて自分で確かめること
  topic_hint: GRとMGでの観測量への影響（暗黒エネルギーと修正重力の音速の論文）
  topic_hint_terms:
  - 観測量
  - GR
  - MG
  module_hint: ξ_±
  input_hints:
    theta: "1.0, 3.0, 10.0, 30.0"
    A: 1.0
  wiring_names:
  - 雑音だけ（既定の大きさ）
  - 雑音だけ（桁を合わせた）
  - 雑音と平均化（桁を合わせた）
  wiring_parts:
  - - ガウス雑音
  - - ガウス雑音
  - - ガウス雑音
    - 平均化
  wiring_params:
  - {}
  - ガウス雑音:
      sigma: 1.0e-11
  - ガウス雑音:
      sigma: 1.0e-11
    平均化:
      n: 16
  questions:
  - 雑音の大きさを出力の桁に合わせたら段階の言葉が変わったのは、理論ではなく配線の違いから来ていると読んでよいですか？
  - AI の改訂案は、採用しない限り私の配線を変えないと考えてよいですか？
per_archetype:
  skeptic:
    questions:
    - sigma を出力の桁に合わせて平均化を足したら「分離できる」に変わったのは、雑音を小さくしただけで、理論が確かめられたわけではないですよね？
    - AI の改訂案は、どの部品のどの値を、何を根拠に変えようとしているのですか？
