scenario: s-ask-where-from
domain: astrophysics
# 第 15 波: 部品とグラフのある論文（7ef9e487）のトピックへ向け直した
params:
  goal_text: この論文の式がどこから出てきたかを説明できるようになること
  topic_hint: 二重ネットワークとTOV方程式の課し方（PINN による中性子星状態方程式）
  topic_hint_terms:
  - TOV
  - 二重ネットワーク
  - 状態方程式
  seed_questions:
  - EOS ネットワークの入力 x の式を教えてください。
  where_from_questions:
  - この式はどこから出てきたんですか？
  - 前の回答のどこが根拠ですか？
  - ε_join で x が 0 になるというのは、どの段で決めていますか？
  - その段の前提は、論文のどの主張ですか？
personas:
  # sim-sandbox P-01 / E-0003: 推定 EOS を数値（ε, P の表）として自分の TOV コードに入れられるかを確かめる
  st-11-m1-neutron-first-sim:
    goal_text: 論文が推定した状態方程式を、自分の TOV 積分コードに入れられる数値（ε と P の表）として取り出すこと
    seed_questions:
    - この論文が推定した状態方程式（EOS）を、エネルギー密度 ε と圧力 P の数値の表として取り出せますか？単位は MeV/fm^3 でお願いします。
    where_from_questions:
    - その値は論文のどこにありますか？表ですか、図ですか、本文の数点ですか？
    - 図からしか読めないなら、論文の本文に数値として書かれている点（P(ρ_0)、ε_join、M_max、R_1.4 など）を全部挙げてください。
    - 推定 EOS をそのまま自分の TOV コードに入れるには、何が足りませんか？論文に無いものと、あるものを分けて教えてください。
per_archetype:
  skeptic:
    where_from_questions:
    - それはどこに書いてありますか？
    - 前の回答の根拠の出典番号は、原文のどの節ですか？
    - その正規化は導かれたものですか、設計上の選択ですか？どこに書いてありますか？
  non_native:
    goal_text: explaining where an equation of the paper comes from
    seed_questions:
    - Please show the equation for the input x of the EOS network.
    where_from_questions:
    - Where does this equation come from?
    - Which part of your previous answer is the evidence?
