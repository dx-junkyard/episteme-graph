scenario: s-voice-casual
domain: astrophysics
params:
  goal_text: 移動の合間に、今日の講義の話を思い出して整理すること
  topic_hint: 宇宙膨張と赤方偏移
  casual_utterances:
    - ねえ、宇宙が膨張してるって、結局なにが伸びてるの？
    - じゃあ、僕らの体とか地球も伸びてるってこと？
    - 赤方偏移ってさ、救急車のサイレンと同じ話でいいの？
    - 遠くの銀河って、光より速く遠ざかることあるの？
    - さっきのやつ、一言でまとめるとどうなる？
    - ハッブル定数って、なんで測る人によって値が違うの？
  followup_question: さっき音声で聞いた「空間そのものが伸びる」という話を、式で見るとどういうことになるのか、教材のどこに書いてあるかも含めて教えてください。
per_archetype:
  voice_first:
    casual_utterances:
      - えっと、宇宙が膨張してるってさ、あれ何が伸びてんの？
      - あー、じゃあ地球とかも伸びてる？
      - 赤方偏移ってさ、救急車のやつと一緒？
      - 光より速く逃げてく銀河って、あるの？
      - いまの、ひとことで言うと？
      - ハッブル定数ってさ、なんで人によって値違うの？
