domain: astrophysics
# 第 25 周・面 B (e)。コース 1bad7d9f の Cepheus B 論文の DCF 法のトピック（教員の (b) と同じ論文）。
params:
  goal_text: 教材の主張がどこまで確かめられているのかを、出典と台帳の一行で確かめること
  topic_hint: DCF法による磁場強度の推定（Cepheus B の磁場トポロジーと星形成の論文）
  topic_hint_terms: [DCF法, 磁場強度]
  seed_questions:
    - この磁場強度の推定は、どの条件のもとで確かめられているのですか？
    - この推定が成り立たなくなるのは、どんな観測が出たときですか？
  map_question: 分野の地図のこの項目に「記帳」と書いてあるのは、何を確かめた記録のことですか？どこで詳しく見られますか？
per_archetype:
  skeptic:
    seed_questions:
      - DCF 法の等分配の仮定は、この論文の中で検証されていますか？
      - 検証されていないなら、それはどこにそう書いてありますか？
  confident_theorist:
    seed_questions:
      - 等分配の仮定が崩れたとき、推定はどちらに偏りますか？
      - その偏りを確かめた記録はありますか？
  non_native:
    goal_text: checking how far the claims in the material have been verified
    seed_questions:
      - Under what conditions has this magnetic field estimate been verified?
      - What observation would make this estimate fail?
    map_question: On the field map, what does the note on this item mean, and where can I see the details?
