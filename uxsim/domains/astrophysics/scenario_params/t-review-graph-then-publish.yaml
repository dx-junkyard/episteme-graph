scenario: t-review-graph-then-publish
domain: astrophysics
params:
  course_title: 大規模構造論文ゼミ コース
  graph_questions:
    - このグラフの全体像を、論文の理論の組み立てとして短く説明してください。
    - このノードの根拠になっている原文はどこですか？
    - 線形成長率を導く流れの中で、論文が式として示していない段はありますか？
    - このノードとその下流のノードの関係は、論文のどの記述から来ていますか？
    - 主張の中に、観測で確かめられたものと理論の仮定からのものが混ざっていませんか？
    - 承認していないノードのうち、ゼミで扱うのに重要なものはどれですか？
  reject_reason_examples:
    - 根拠の引用が論文の別の節の話で、このノードの内容を支えていない
    - 名前が式の記号の並びになっていて、何の段階なのかが読めない
    - 論文では仮定として置かれているものを、導かれた結果として扱っている
    - 同じ内容のノードが別にあり、重複している
  builder_messages:
    - グラフで承認した部分を中心に、4 章のコースの章立てを作ってください。
    - 却下したノードに頼っているトピックがあれば外してください。
    - これで登録します。
per_archetype:
  veteran_clicks_through:
    graph_questions:
      - 全体をざっと教えて。
      - 問題のあるノードだけ教えて。
    builder_messages:
      - この教材でコースを作って。登録する。
  copilot_dependent:
    graph_questions:
      - このグラフのどこから見ればいいですか？
      - このノードは承認してよいものですか？判断の手がかりを教えてください。
      - 次の未レビューのノードはどれですか？
