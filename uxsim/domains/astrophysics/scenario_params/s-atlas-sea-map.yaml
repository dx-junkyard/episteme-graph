scenario: s-atlas-sea-map
domain: astrophysics
params:
  goal_text: 分野のどこに論文が厚く、どこがまだ薄いかをつかむこと
personas:
  st-01-m1-radio:
    goal_text: 電波観測に近い領域に論文がどれくらい集まっているか（厚いか薄いか）をつかむこと
  st-07-m1-grb-voice:
    goal_text: 自分の興味（突発天体）に近い領域が地図の端にあるかどうかを確かめること
  st-09-d2-from-datasci:
    goal_text: データ解析の手法を使う論文が、分野のどの領域に厚く集まり、どこが薄いかを地図の濃淡から読むこと
  st-10-d3-21cm-receiver:
    # 第 4 周（judge_atlas_r3 §5）: 円の名前（IK-0941）と、海と L1 の霧の一致
    goal_text: 21cm 線の観測に近い領域に論文が厚いか薄いかを、論文の海と分野の地図の両方で読み比べること
  st-02-m2-lensing-theory:
    # 第 5 周（凍結の後）: 版が上がった地図の海と L1 の霧の一致、円の名前
    goal_text: 重力レンズの理論に近い領域に論文が厚いか薄いかを、論文の海と分野の地図の両方で読み比べること
  st-08-m1-rprocess-lecture:
    # 第 6 周（凍結 2026.3 の後・地図の場面は初めて）: 版が上がった地図の海と L1 の霧の一致・取り込んだ主題が海の縁で
    # 「地図に無い」と言われ続けるか（IK-0990）
    goal_text: r過程元素合成に近い領域に論文が厚いか薄いかを、論文の海と分野の地図の両方で読み比べること
    # 第 7 周（judge_atlas_r6 §6）: 版上げ 2026.4 の後に、海に版の表示があるか・L1 の霧と海の一致・L2。加わった項目があれば縁が
    # その項目で解消されるか（IK-0990 の 2 回目）。atlas_added_items で加わった項目が無いと分かっていても歩く（版上げだけの海と L2）
    # 第 8 周（judge_atlas_r7 §6）: 2026.5（関係だけの版上げ）の後。海の画面に地図の版が言われるか（IK-0942 の是正後）・L1 の霧との一致。
    # 縁は項目の加わる版上げまで変わらない見込み（IK-0990 は判定不能のまま）
