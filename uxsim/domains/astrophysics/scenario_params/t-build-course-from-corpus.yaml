scenario: t-build-course-from-corpus
domain: astrophysics
params:
  course_title: 観測的宇宙論ゼミ 予習コース
  copilot_question: 取り込んだ論文からゼミ用のコースを作りたいのですが、最初に何をすればいいですか？
  builder_messages:
    - 章立ての案はいいのですが、2 章目の宇宙背景放射は 1 本の論文だけに頼っていませんか？どの論文のどの節から作っているかを示してください。
    - 学ぶ単位の候補の中に、統計的な推定を扱うものはありますか？あれば 4 章目に入れてください。
    - 各トピックの前提知識を、学生がつまずきやすい順に並べ直してください。
    - バリオン音響振動のトピックは、相関関数の図がある単位を中心にしてください。
    - 論文に書かれていない説明を足している箇所があれば、そうだと分かるようにしてください。
    - これで登録します。最後に章とトピックの一覧をもう一度見せてください。
per_archetype:
  veteran_clicks_through:
    builder_messages:
      - それでいい。登録するから一覧だけ出して。
  copilot_dependent:
    copilot_question: コースビルダーでコースを作る手順を、一歩ずつ教えてください。今は教材管理の画面にいます。
    builder_messages:
      - この章立てで大丈夫でしょうか。入門の学生向けに、分野独特の言い方には説明を添えてほしいです。
      - 次は何をすればいいですか？このまま登録してよいですか？
  meticulous_reviewer:
    builder_messages:
      - 各トピックがどの学ぶ単位から作られているかを、単位の名前で一覧にしてください。
      - 3 章目の非線形領域のトピックは、論文の中で確かめられている範囲と、著者の推測の範囲を分けてください。
      - 学ぶ単位の候補のうち、どの章にも使っていないものを挙げてください。使わない理由も書いてください。
      - 前提知識に、同じコースの別のトピックを指しているものがあれば、その対応を示してください。
      - 論文に書かれていない説明を足している箇所を全部挙げてください。
      - これで登録します。
personas:
  te-04-copilot-intro:
    course_title: 論文紹介ゼミ（宇宙物理）2026 秋
    builder_messages:
      - この章立てで大丈夫でしょうか。論文 1 本につき 1 章になっていますか。分野独特の言い方には説明を添えてほしいです。
      - 各章で、主結果を支える式や図がどれかを示してください。
      - 次は何をすればいいですか？このまま登録してよいですか？
  te-01-rookie-seminar:
    course_title: 研究室ゼミ 論文の読み合わせ（宇宙物理）
    builder_messages:
      - 章立ては論文 1 本につき 1 章になっていますか。なっていなければ直してください。
      - 各章の最初のトピックは、その論文が何を示したかが一目で分かる題にしてください。
      - 学ぶ単位の候補のうち、どの章にも使っていないものを挙げてください。
      - これで登録します。最後に章とトピックの一覧を見せてください。
