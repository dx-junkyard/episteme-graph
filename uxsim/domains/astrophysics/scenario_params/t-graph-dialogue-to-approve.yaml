scenario: t-graph-dialogue-to-approve
domain: astrophysics
params:
  goal_text: 理論構成を確かめ、根拠の主張を承認すること
  material_hint: グラフと論文層がある教材（「Neutron Star Equation of State via Physics Informed Neural Network」か「2606.02318v1」の行。どちらかを開く）
  graph_questions:
  - この論文の理論構成をおおづかみに説明してください。
  node_questions:
  - このノードの根拠になっている原文はどこですか？
  - この主張は観測で確かめられたものですか、仮定ですか？
  - このノードと下流のノードの関係は論文のどこから来ていますか？
personas:
  # sim-sandbox P-03 / E-0006: Cepheus B の論文の DCF 法の説明を、原文と照らしてから承認する
  te-06-ism-dcf-exercise:
    goal_text: M1 向け教材にする前に、DCF 法の説明が論文の記述と教科書の一般論のどちらに基づくかを一つずつ確かめ、根拠のある主張だけ承認すること
    material_hint: Cepheus B の磁場トポロジーと星形成の論文（「2605.26810v1」か「Magnetic field Topology and Star Formation in the Cepheus B」の行）
    graph_questions:
    - この論文の理論構成を、観測量（偏光角分散・速度分散・密度）から磁場強度に至る流れとして説明してください。どこが論文の記述で、どこが一般論ですか。
    node_questions:
    - このノードの根拠になっている原文はどこですか？補正係数や乱流セル数 N の値は論文のどこに書かれていますか？
    - この主張は観測で確かめられたものですか、DCF 法の仮定（アルヴェン的擾乱・小角近似）ですか？
    - このノードと下流の磁場強度のノードの関係は、論文のどこから来ていますか？視線方向の平均化の補正はどう扱われていますか？
