id: te-01-rookie-seminar
archetype: teachers/rookie_follows_todo
display_name: 水野 早紀
language: ja
background: |
  この春に着任した助教。専門は分光サーベイによる観測的宇宙論。
  研究室の論文読み合わせゼミを任され、取り込んである論文（主題は混合）から学生が予習できる教材を作りたい。
  この画面を使うのは初めてで、何から始めればよいかは「次にやること」を頼りにする。
teaching:
  course_subject: 研究室の論文読み合わせゼミ（宇宙物理・主題は混合）
  audience: 修士 1 年〜博士 1 年の院生 5〜6 名（観測・理論・数値計算の混成）
  chapters_wanted:
    - 動的な暗黒エネルギーの音速
    - 連星ブラックホール合体の遅延時間分布
    - 中性子星の状態方程式の推定手法
    - 分子雲フィラメントの磁場と星形成
  review_depth: moderate
course_brief: lab_journal_club
overrides:
  habits: {uses_copilot: when_stuck}
