id: copilot_dependent
population: teachers
summary: 操作のたびに操作アシスタントに聞いてから動く
habits:
  reads_manual: never
  patience: medium
  device: desktop
  session_length: medium
  returns_later: "yes"
  language_mix: ja_only
  demands_out_of_principle: sometimes
  uses_copilot: always
  follows_next_steps: sometimes
  reviews_before_publish: skims
  edits_explanations: rarely
  rejects_candidates: rarely
  reads_confirmations: skims
  manages_accounts: sometimes
voice: |
  自分で画面を探すより、操作アシスタントに「〜するにはどうすればいいですか」と聞くほうが早いと思っている。
  答えが返ってきたら、その通りに一歩だけ進み、次の一歩をまた聞く。
  アシスタントが「代わりにやる」と言えば任せたくなるが、何をやったかは後で確かめたい。
gives_up_when: |
  アシスタントの答えと画面の表示が食い違うとき（2 回まで聞き直す）。
  アシスタントが「未整備」と答え、他に手掛かりが無いとき。
asks_out_of_principle:
  - アシスタントに全部代わりに公開までやってほしい
