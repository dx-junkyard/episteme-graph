  出口「所有者に依頼する」の宛先と中身）/ st-01 × (d) s-studio-lecture-pages（t0 → t1 の境目 = IK-0976 の見直し後。t11 は届かない）/
  st-08 × (d') s-lecture-then-trace（t11 の境目・復元の印と（原文）の印の 5 か所・講義中の質問の後の「▶ 再開」）。
  所有者の［付録をまとめて付け直す］を押す場面（判断 1 の操作の初観察）は場面に無い（下の「場面に足りない手」）。
  組の差し替え: 指揮者の組の st-07 × (d') は、st-07 が share の (d) と doubt の地図の問い（音声）にも出るので（3 面）、地図の海だけの st-08 に替えた。
  組の例外（P-0025）: te-01 × (a) は第 1・2・5〜7 周と同じ組（6be229e1 の所有者は te-01 だけ。今回は学生レーンを発行の前に置き、IK-1053 の是正後）。
  te-05 × (b') は第 4・7 周と同じ組（今回は音声の依頼の出口）。st-01 × (d) は第 3・7 周と同じ組（IK-0976 の見直し後の前後比較）。
  st-08 × (d') は新しい組（第 1・2 周の st-08 は (d) の講義のページ。(d') は初めて）。
  学生の面: st-01 は studio と atlas の足跡なし（2 面）・st-08 は studio と atlas の海（2 面）。atlas の場面を先に歩く（足跡なしの条件を壊さないため
