  第 25 周 面 D（原稿スタジオ → 学生の受講）の第 3 周（judge_studio_r2.md §5 の組。4 組とも第 1・2 周と別 — P-0025）。

  ── 周の前に指揮者が用意するもの（この順）──
   1. 砂場（H12）: 固定コース 6be229e1 のトピック t0 / t16 を第 1 周以前の状態に戻すか、snapshot を取り直す。
   2. 同名コースの封じ（H4・IK-0407）: `backend/.venv/bin/python -m uxsim.sandbox.pin_course --campaign
      uxsim/campaigns/astrophysics/c-r25-studio-r3.yaml --yes`。これは 6be229e1 と同じ題名の 1bad7d9f を private にする。
      1bad7d9f は他の 3 面（atlas / share / doubt）の固定コースなので、3 面の学生レーンと同時に回すときは、受講登録済みの
      学生が private 化の後も読めるかを確かめていない（未確認）— 3 面の学生レーンの後に pin_course を走らせるか、
      private 化の影響を先に確かめる。
   3. editor 共有（(b'3) の前）: te-01 として 6be229e1 を te-04 の入ったグループへ editor で共有する（第 2 周の te-02 と同じ
      手順: グループ作成 → 招待コードで参加 → POST /api/admin/courses/6be229e1/groups {permission: editor}）。
   4. 是正と投影の同期: 是正波の後に投影の同期（projection_sync_r2.md の手順）を周の前に終える。面の審判 T7〜T9 は同期後の
      読み取り区画で数え直す。**(b3) は IK-0909（書き換えの根拠の切り詰め）の是正後、(b'3) は IK-0908（editor の保存の事前表示）の
      是正後**に回す。IK-0874（根拠の空での事前判定）の是正も (b3) の前提。
   5. ハーネス（H16）: **(d'3) と (d3) の講義の最後までのタイマー送りは、音声ゼロのトピックで講義を辿る行為が runner に入ってから**
      回す。入っていなければ S1・S2 は第 2 周と同じく評価外になる（そう記録する）。
   6. 付録の旧形式（IK-0872）の読み時の付け直しはオーナー判断待ち（judge_studio_r2 §6）。判断の前なら、学生が旧形式の付録を
      読むのは既知の残存で、新しい所見にしない。

  ── コースの事実（交わり方）──
  原稿スタジオの保存・図の採用はコースの所有者だけができる（course_data_for_owner）。te-03 は 6be229e1 も 1bad7d9f も所有しないので、
  (a3)(c3) は経路の前提 owns_course が欠けると種まき t-v5-register-own-course（LLM 2〜3 回）で作った自分のコースで歩く（doubt の
  第 1 周の種まきのコースが残っていればそれを使う）。よって学生の (d3)(d'3) は te-03 の保存・採用と交わらず、審判 S1〜S3・X1〜X4 は
  固定コース 6be229e1 の周の前の状態（用意 1）と突き合わせる。te-04 は 1bad7d9f の所有者なので (b3) は 1bad7d9f の先頭トピックで歩き、
  経路の保存（任意の 1 手）を選ぶと他の 3 面の学生が読む 1bad7d9f の教材が変わる — **(b3) は他の 3 面の学生レーンが終わってから回す**。
  音声生成の 1 トピック（judge_studio_r2 §5 の「可能なら」）は runner に行為が無いので扱わない（IK-0877 の残りは未確認のまま）。

  ── 場面の組とレーンの順（--persona X --scenario Y で 1 場面ずつ・この順で）──
   (a3)  te-03-meticulous-seminar × t-studio-split-save   — 区切りの揃え方（notes・末尾の区切り IK-0914）、❓ でのインジケータ
         （IK-0913）、保存の届き方（IK-0915）（LLM 0 回 + 種まき 0〜3 回）
   (c3)  te-03-meticulous-seminar × t-studio-figure-adopt — 図の提案 → 1〜2 ターン → 採用 → 保存 → 公開。採用後の根拠リンク（IK-0910）
         （LLM 1〜3 回。図スタジオの turn は頭脳の応答まで数百秒 — 第 2 周 H7）
   (d3)  st-01-m1-radio × s-studio-lecture-pages          — 固定コースの先頭トピック。スライドの区画と教材の区画の対応（S1）（LLM 0 回）
   (b3)  te-04-copilot-intro × t-studio-rewrite-panes     — 自分のコース 1bad7d9f（コース内容生成済み）。学ぶ単位を材料にした書き換え
         （IK-0909）・根拠の空での事前判定（IK-0874）（LLM 1 回）
   (b'3) te-04-copilot-intro × t-studio-rewrite-shared    — 用意 3 の後。6be229e1 で書き換え → 保存の事前表示（IK-0908）（LLM 1 回）。
         保存されないので 6be229e1 は変わらない
   (d'3) st-04-intl-exoplanet × s-lecture-then-trace      — 音声ゼロでの講義のタイマー送りを最後まで（H16 の後）、講義の流れと教材の
         区画の比較（S2）、付録の旧形式の残存（チャットで LLM 最大 3 回）

  LLM 予算の見積り: 種まき 0〜3 + 図スタジオ 1〜3（+ 図の提案 0〜1）+ 書き換え 2 + 学生のチャット 最大 3 = 最大 12 回（余裕を見て 22）。
  TTS は呼ばない。ペルソナ頭脳は 6 場面 × 45〜55 手。

