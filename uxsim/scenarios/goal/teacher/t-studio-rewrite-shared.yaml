id: t-studio-rewrite-shared
population: teachers
runner: [api]
# 第 25 周 面 D 第 2 周（harness_fixes_studio.md H8）: 種まきで登録した直後のコースはコース内容生成をしていないので
# 書き換えの根拠が空になる（IK-0874）。書き換えの品質と、editor 共有の教員の保存（設計時の疑い 6）を見るため、
# 指揮者が te-01 の所有コース（コース内容生成済み）をこのペルソナに editor 共有してから歩く。前提の検査は持たない
# （共有の有無は open_course の応答で分かる。共有が無ければ 404 で場面がそこで止まる）。
goal: "{{goal_text}}"
params_required: [goal_text, shared_course_id, rewrite_prompt]
steps:
  - do: auth.login
  - do: admin.courses.list
    note: 共有されたコースが一覧にあるかを確かめる
  - do: admin.lecture_studio.open_course
    with: {course_id: "{{shared_course_id}}"}
    note: 共有されたコースを原稿スタジオで選ぶ
  - do: admin.lecture_studio.select_topic
    with: {prefer: first}
    note: 先頭のトピックの授業用ドラフトを開く（コース内容生成済みの本文がある）
  - do: admin.lecture_studio.right_pane_evidence
    note: このドラフトを支える根拠を確かめる
  - do: admin.lecture_studio.rewrite_topic
    with: {prompt: "{{rewrite_prompt}}"}
    note: AI に書き換えを頼み、埋め込み（部品・式・図）が残っているかと、本文が根拠に沿っているかを読む
  - do: admin.lecture_studio.save_topic
    note: 共有された側として保存を試み、保存できるか・できないならその理由が画面で分かるかを読む
  - do: admin.lecture_studio.rewrite_copy
    note: 保存できないなら、試した案を所有者に渡すために［案をコピー］で写す（第 3 波・IK-0950）
  # 第 25 周 第 8 周 studio H39: 共有された側の音声の出口（IK-1071 — 押せない理由と「所有者に依頼する」）を読む
  - do: admin.lecture_studio.audio_readiness
    note: 音声生成のボタンが押せるか。押せないなら理由と次の操作（所有者に依頼する・誰に何を渡すか）が画面で揃うかを読む
  # 第 25 周 第 8 波（IK-1071）: 押せない「→ 所有者に依頼する」は［依頼の文をコピー］に置き換わった
  - choose:
      - do: admin.lecture_studio.audio_request_copy
        note: 理由の横の［依頼の文をコピー］で、所有者に渡す文（コース・お願い・言語・音声の状態・音声の無いトピック）を写し、宛先の名前が揃うかを読む
    optional: true
stop_when: [gave_up, blocked, budget_exhausted]
expects:
  - manual: teacher/14-admin-lecture-studio.md#assistant-modal
  - manual: teacher/14-admin-lecture-studio.md#course-draft
  - manual: teacher/14-admin-lecture-studio.md#rewrite-copy
  - manual: teacher/14-admin-lecture-studio.md#save-btn
  - manual: teacher/14-admin-lecture-studio.md#audio-all-btn
  - manual: teacher/14-admin-lecture-studio.md#audio-request-copy
watch_for:
  - 書き換えは提案として欄に入り、保存するまで受講者に届かないことが分かる
  - 書き換えの本文が、このトピックの根拠（論理要素・主張・数式）から外れたことを足していない
  - 共有された教員が保存できないなら、保存の前か後に理由が画面で分かる（「保存に失敗しました」だけで終わらない）
  - 音声を作れない共有教員には、理由（所有者名入り）と［依頼の文をコピー］の出口が出て、写した文の見出しと宛先の名前が揃う（IK-1071）
  # 第 9 波（sync_keys_wave9 面 D・IK-1081）
  - 古い生成規則の作業メモが残るトピックは、コースの見出しの一覧とトピックの事実文で分かり、書き換えの案に作業メモが持ち込まれない
  # 第 10 波（sync_keys_wave10 面 D・IK-1081 の残り）
  - 作業メモの一覧が「本文の「注」の段落に残る」と「注意点だけに残る」の 2 つに分かれ、注意点の「埋め込んでいません」が本文と食い違うトピックには事実文が出る
