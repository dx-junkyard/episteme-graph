id: s-v5-revisit-rewrite
population: students
runner: [api, browser]
session: 2
preconditions:
  - text: 前のセッションでこのペルソナが持ち越しの問いを残している
    check: return_door
    requires: [carryover]
seed_scenarios: [s-v5-leave-and-carry]
goal: '{{goal_text}} の続きで、持ち越した問いに答えたあと、その答えを書き直して、扉と記録がどう変わるかを確かめる'
params_required: [goal_text, revisit_answer_text, carryover_answer, rewritten_answer]
steps:
  - do: auth.login
  - do: learning.course.list
  - do: learning.course.open
  - do: learning.cycle.return_door
  - do: learning.discuss.opening
  - do: learning.cycle.intention
    with: {role: revisit_answer, text: '{{revisit_answer_text}}'}
    note: 開幕画面の欄で持ち越しの問いに答える
  - do: learning.discuss.ask
    with: {message: '{{carryover_answer}}'}
    note: 同じ答えを議論の会話にも書いて、AI の受け取り方を見る
  - do: learning.chat.rewrite
    with: {message: '{{rewritten_answer}}', topic: discussion}
    note: さっきの発言を ✏️ で書き直す（考えが変わった）
  - do: learning.cycle.return_door
    note: 扉の持ち越しの問いがどうなったかを見る
  - do: learning.records.mine
    note: 書き直した前の発言の記録がどうなったか（消えたか・状態で残ったか）を見る
stop_when: [gave_up, blocked, budget_exhausted, persona_stop]
expects:
  - manual: student/02-student.md#edit-delete-message
  - manual: student/02-student.md#return-door
  - manual: student/02-student.md#my-records
watch_for:
  - 書き直すと、元の発言以降の往復が会話から外れ、新しい答えに対して応答が返る
  - 書き直した前の発言から生まれた記録は消えずに、取り消された状態の名前付きで記録に残る
  - 持ち越しに答えたあとの扉に、答えたことを評価する文・督促が出ない
