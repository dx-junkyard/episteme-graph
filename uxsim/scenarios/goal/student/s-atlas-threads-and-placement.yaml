id: s-atlas-threads-and-placement
population: students
runner: [api, browser]
session: 1
goal: '{{goal_text}} のために、分野の地図を開き、推定の糸と論文の位置を重ねて、どれが AI の推定でどれが確かめられたものかを読み分ける'
params_required: [goal_text]
steps:
  - do: auth.login
  - do: learning.course.list
  - do: learning.course.open
  - do: learning.atlas.view
    note: 分野レベルの地図で、いまここと領域を読む
  - do: learning.atlas.layers
    note: コースレベルで「推定の糸」と「論文の位置」をオンにする。糸に付く出所と骨格の版、位置ごとの出所ラベルを読む
  - do: learning.landscape.view
    note: 出典タブの「分野の中の位置づけ」でも同じ論文の位置を読み、地図と食い違わないかを見る
  - choose:
      - {do: learning.atlas.threads}
      - {do: learning.atlas.view, with: {level: 2}}
      - {do: learning.atlas.select_node}
    optional: true
stop_when: [gave_up, blocked, budget_exhausted, persona_stop]
expects:
  - manual: student/02-student.md#relation-threads
  - manual: student/02-student.md#paper-placement
  - manual: student/02-student.md#field-atlas
watch_for:
  - 推定の糸は点線で「AIによる推定（未確認）・骨格 版…」が付き、概念どうしだけを結び、数値（近さの値）が出ない
  - 教員が見送った関係は糸に出ない（同じ周の教員レーンの後に走らせる — 審判 B5）
  - 糸が出ないときは切り替え自体が出ない（空の層を見せない）
  - 論文の位置ごとに「AIによる推定（未確認）」か「教員確認済み」が付き、重みや確からしさの数値が出ない
  - 教員が凍結した後は地図の骨格の版が上がり、現行版に対応の無い位置づけは位置に置かれず版の事実文で示される
