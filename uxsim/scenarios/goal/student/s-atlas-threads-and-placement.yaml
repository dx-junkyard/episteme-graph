id: s-atlas-threads-and-placement
population: students
# 第 25 周 第 7 周 atlas H43: 是正の確かめが固定コース（campaign の course_id）に依存する場面は最初の open を固定する。
# 同題名のコースを人がどう見分けるか（IK-0407）を観察したい場面とは分ける（その場面には pin_course を付けない）
pin_course: true
runner: [api, browser]
session: 1
goal: '{{goal_text}} のために、分野の地図を開き、推定の糸と論文の位置を重ねて、どれが AI の推定でどれが確かめられたものかを読み分ける'
params_required: [goal_text]
steps:
  - do: auth.login
  - do: learning.course.list
  - do: learning.course.open
  - do: learning.atlas.view
    note: 分野レベルの地図で、いまここと領域を読む
  - do: learning.atlas.layers
    note: コースレベルで「推定の糸」と「論文の位置」をオンにする。糸に付く出所と骨格の版、位置ごとの出所ラベルを読む
  - do: learning.landscape.view
    note: 出典タブの「分野の中の位置づけ」でも同じ論文の位置を読み、地図と食い違わないかを見る
  - choose:
      - {do: learning.atlas.threads}
      - {do: learning.atlas.view, with: {level: 2}}
      - {do: learning.atlas.select_node}
    optional: true
stop_when: [gave_up, blocked, budget_exhausted, persona_stop]
expects:
  - manual: student/02-student.md#relation-threads
  - manual: student/02-student.md#paper-placement
  - manual: student/02-student.md#field-atlas
watch_for:
  - 推定の糸は点線で「AIによる推定（未確認）・地図 版…」が付き、概念どうしだけを結び、数値（近さの値）が出ない
  - 教員が見送った関係は糸に出ない（同じ周の教員レーンの後に走らせる — 審判 B5）
  - 糸が出ないときは切り替え自体が出ない（空の層を見せない）
  - 論文の位置ごとに「AIによる推定（未確認）」か「教員確認済み」が付き、重みや確からしさの数値が出ない
  - 教員が凍結した後は地図の骨格の版が上がり、現行版に対応の無い位置づけは位置に置かれず版の事実文で示される
  # 第 9 波（sync_keys_wave9 面 C・IK-1072 / IK-1073）
  - コースレベルの実線のうち依存の関係だけに矢じりが付き、事実文の行に「矢印のある線は向きのある関係です（…依存する側から依存される側へ）」が名前の列挙で出る（件数なし）
  - 地図の場所に結びついた学習の記録が無いうちは「いまここ」の印が無く、その理由（目次の「学習中」とは別の印であること）が事実文で出る
  - 右パネルの「地図の関係:」は確定済みの関係を名前で列挙し、置かれた論文の名前は出さない
  # 第 25 周 第 10 波（atlas H52・IK-1118）: 描けなかった関係の名前の行
  - 上限で線を描けなかった確定済みの関係も、名前の行で向き（依存する側 → 依存される側）が読める
  - 関係を言う全ての面（コースレベルの実線・描けなかった関係の名前の行・右パネル）で、同じ関係が同じ向き・同じ句で書かれる
  # 第 10 波（sync_keys_wave10 面 C・IK-1119）
  - 右パネルに「ここに置かれているこのコースの論文」が題名と出所ラベル（教員確認済み / AIによる推定（未確認））で出て、件数が出ない
  - 改訂で加わった関係にだけ「（版 X で加わった）」が付き、その版が凍結の履歴と食い違わない
