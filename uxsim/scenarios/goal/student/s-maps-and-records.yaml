id: s-maps-and-records
population: students
runner: [api, browser]
goal: "{{goal_text}} のために、いま学んでいる論文が分野の中のどこにあるのかを地図で確かめ、コースの外の論文も見わたして、自分の記録を読み返す"
params_required: [goal_text, atlas_region_hint, corpus_question]
steps:
  - do: auth.login
  - do: learning.course.open
  - do: learning.atlas.view
    note: 分野の地図を開き、{{atlas_region_hint}} のあたりを探す
  - do: learning.landscape.view
    note: 論文の位置づけを見て、AI の推定と教員の確認の区別を読む
  - do: learning.corpus.domains
  - do: learning.corpus.documents
    note: 論文の海で、コースに入っていない論文を探す
  - choose:
      - do: learning.corpus.discuss_ask
        with: {message: "{{corpus_question}}"}
        note: コースの外の論文と議論してみる
      - do: learning.element.context
        note: 論文の一覧から気になる要素の文脈を開く
    optional: true
  - do: learning.records.mine
    note: わたしの記録を開き、自分が残したものを読み返す
  - do: learning.progress
stop_when: [gave_up, blocked, budget_exhausted]
expects:
  - manual: student/02-student.md#field-atlas
  - manual: student/02-student.md#paper-placement
  - manual: student/02-student.md#corpus-sea
  - manual: student/02-student.md#my-records
watch_for:
  - 地図が用意されていないコースでは、無関係な分野の地図が出ずに地図の領域ごと出ない
  - 論文の位置づけに「AIによる推定（未確認）」と「教員確認済み」の区別が必ず付き、数値の重みや確信度が出ない
  - 論文の海の密度は段階の濃淡だけで表され、件数や割合が出ない
  - 確かめられていないことについて「このコーパスの中では」という範囲の言い方がされ、分野全体で未検証だと言わない
  - わたしの記録に、本人が取り下げたものや古くなったものも状態付きで残っている
