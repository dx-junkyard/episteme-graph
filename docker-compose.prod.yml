version: "3.9"

# 本番補助オーバーライドファイル（ngrok トンネル）
# 使用方法: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# このファイルはベースの docker-compose.yml に「重ねる」形で機能します。
# 本番で外部公開トンネルが要るときだけ ngrok サービスを追加します。
#
# ※ api-server のポートはここでも開放しません。
#   すべての API アクセスは必ず Nginx (frontend:3000) 経由にしてください。
#
# ※ api-server の環境変数（`env_file: .env` を含む）はベースの docker-compose.yml で
#   宣言済みで、オーバーライド側にも自動的に引き継がれます。ここで api-server を
#   再宣言して env_file を重ねると、同じ .env を二重に読み込むだけなので行いません
#   （2026-09-03 時点で本ファイルは api-server サービスを定義していない）。

services:
  # ── ngrok トンネル ───────────────────────────────────────────────
  # 固定ドメインを使ったローカル→外部公開トンネル。
  # frontend コンテナの 3000 番ポート（Nginx）にトラフィックを転送します。
  #
  # 事前準備:
  #   1. https://ngrok.com でアカウント作成・固定ドメインを取得
  #   2. .env に NGROK_AUTHTOKEN と NGROK_DOMAIN を設定
  #      例: NGROK_AUTHTOKEN=your_auth_token
  #          NGROK_DOMAIN=your-subdomain.ngrok-free.app
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command: http --domain=${NGROK_DOMAIN} frontend:3000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      - frontend
    networks:
      - episteme
    ports:
      - "4040:4040"   # ngrok Web UI (トンネル状態確認)
