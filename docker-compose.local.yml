version: "3.9"

# ローカル開発用オーバーライドファイル
# 使用方法: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
# このファイルは本番用の docker-compose.yml を「上書き」する形で機能します。
# 開発時のみ必要なポート公開や ngrok トンネルをここで定義します。
#
# ※ api-server のポートはここでも開放しません。
#   すべての API アクセスは必ず Nginx (frontend:3000) 経由にしてください。

services:
  # ── 開発用ポート公開 ─────────────────────────────────────────────
  grobid:
    ports:
      - "8070:8070"   # GROBID（開発時のみホストへ公開）

  api-server:
    # ローカルでは同梱 postgres の healthcheck 通過を待つ（ベースはマネージド DB 前提）
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  minio:
    ports:
      - "9000:9000"   # MinIO S3 API
      - "9001:9001"   # MinIO コンソール

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./backend/db/002_a1_a2_a3.sql:/docker-entrypoint-initdb.d/02_a1_a2_a3.sql
      - ./backend/db/003_unanswered_queries.sql:/docker-entrypoint-initdb.d/03_unanswered_queries.sql
    networks:
      - episteme
    ports:
      - "5432:5432"   # PostgreSQL クライアント (psql / TablePlus など)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U episteme"]
      interval: 5s
      timeout: 5s
      retries: 10

