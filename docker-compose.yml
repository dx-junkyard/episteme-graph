version: "3.9"

services:
  # ── Infrastructure ────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/episteme
    volumes:
      - neo4j_data:/data
    networks:
      - episteme

  qdrant:
    image: qdrant/qdrant:v1.9.7
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - episteme

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - episteme

  # ── Application ───────────────────────────────────────────────────
  api-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      JWT_SECRET: ${JWT_SECRET:-episteme-dev-secret-change-in-prod}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_ANALYSIS_MODEL: ${OPENAI_ANALYSIS_MODEL:-gpt-4o}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: neo4j/episteme
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      - neo4j
      - qdrant
      - minio
    networks:
      - episteme
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api-server
    networks:
      - episteme

volumes:
  neo4j_data:
  qdrant_data:
  minio_data:

networks:
  episteme:
    driver: bridge
