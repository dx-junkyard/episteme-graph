version: "3.9"

services:
  # ── Infrastructure ────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/episteme
    volumes:
      - neo4j_data:/data
    networks:
      - episteme

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: episteme
      POSTGRES_USER: episteme
      POSTGRES_PASSWORD: episteme
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./backend/db/002_a1_a2_a3.sql:/docker-entrypoint-initdb.d/02_a1_a2_a3.sql
      - ./backend/db/003_unanswered_queries.sql:/docker-entrypoint-initdb.d/03_unanswered_queries.sql
    networks:
      - episteme
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U episteme"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - episteme

  # ── Application ───────────────────────────────────────────────────
  api-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      JWT_SECRET: ${JWT_SECRET:-episteme-dev-secret-change-in-prod}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-${OPENAI_API_KEY}}
      LLM_ANALYSIS_MODEL: ${LLM_ANALYSIS_MODEL:-${OPENAI_ANALYSIS_MODEL:-o3-mini}}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}}
      # Vertex AI ADC 設定 (LLM_PROVIDER=google)
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-${GOOGLE_CLOUD_PROJECT:-}}
      GCP_LOCATION: ${GCP_LOCATION:-${GOOGLE_CLOUD_LOCATION:-us-central1}}
      GCP_USE_VERTEX_AI: ${GCP_USE_VERTEX_AI:-true}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      # Vertex AI ADC 設定 (LLM_PROVIDER=gemini-vertex のときのみ有効、廃止予定)
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: neo4j/episteme
      DATABASE_URL: postgresql://episteme:episteme@postgres:5432/episteme
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    # LLM_PROVIDER=google (Vertex AI ADC) を使う場合はいずれかの方法で認証情報をマウントする:
    #
    # 方法1: gcloud ADC クレデンシャルを直接マウント
    #   volumes:
    #     - ~/.config/gcloud:/root/.config/gcloud:ro
    #
    # 方法2: サービスアカウントキーファイルをマウント
    #   volumes:
    #     - /path/to/service-account.json:/secrets/sa.json:ro
    #   environment:
    #     GOOGLE_APPLICATION_CREDENTIALS: /secrets/sa.json
    #
    # LLM_PROVIDER=gemini-vertex を使う場合も同様 (廃止予定):
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - episteme
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api-server
    networks:
      - episteme

volumes:
  neo4j_data:
  postgres_data:
  minio_data:

networks:
  episteme:
    driver: bridge
