version: "3.9"

services:
  # ── Infrastructure ────────────────────────────────────────────────
  grobid:
    image: lfoppiano/grobid:0.8.1
    # ホストへのポート公開は開発時のみ（docker-compose.local.yml）。コンテナ間は
    # http://grobid:8070 で到達できる（GROBID_URL 既定）。外部公開は frontend:3000 のみ。
    networks:
      - episteme

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - episteme

  # ── Application ───────────────────────────────────────────────────
  api-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # ── .env をコンテナへ注入する（2026-09-03 追加） ────────────────────
    # backend/core/config.py の Settings は env_file=".env" を宣言しているが、
    # backend/Dockerfile は .env を COPY しない（シークレットをイメージに焼かない）ため、
    # コンテナ内には読むべき .env が存在しない。この env_file が無いと、下の
    # environment: に列挙した変数**以外はすべてコード既定値**になる（機能別のコール上限や
    # worker の on/off を .env で調整しても Docker 実行時には効かない）。
    #
    # required: false … .env が無い環境（CI 等）でも compose を失敗させない
    #                   （Compose Spec / docker compose v2.24 以降で利用可）。
    # 優先順位 … compose では environment: が env_file: に**勝つ**（実測確認済み）。
    env_file:
      - path: .env
        required: false
    # ── environment: に残すのは「.env をそのまま渡すのでは足りない」行だけ ──
    # 整理方針（2026-09-03）: env_file 追加により、`VAR: ${VAR:-<コード既定値と同じ値>}`
    # 形式の行は単なる重複になり、しかも将来 Settings 側の既定値を変えても compose 側が
    # 黙って上書きし続ける（正本の二重化）ため削除した。削除したのは
    # JWT_SECRET / LLM_PROVIDER / LLM_API_KEY / LLM_ANALYSIS_MODEL / LLM_EMBEDDING_MODEL /
    # LLM_EMBEDDING_DIM / GCP_* / GOOGLE_CLOUD_* / MINIO_ENDPOINT / MINIO_ACCESS_KEY /
    # MINIO_SECRET_KEY / ADMIN_PASSWORD / CORS_ORIGINS / EPISTEME_* / LLM_TRANSCRIBE_MODEL /
    # TENSION_* / LLM_MODEL_CATALOG_PATH の各行（いずれも Settings の既定値・
    # AliasChoices と同一の内容だった。OPENAI_* / MINIO_ROOT_* / GOOGLE_CLOUD_* への
    # フォールバックは Settings の AliasChoices が引き継ぐ）。
    # 残す基準は「① コンテナ固有の既定値がホスト側の値と違う ② 複数変数を合成している」の
    # いずれか（かつて③として「Settings が知らない旧 env 名を拾う」を挙げていたが、
    # 下記のとおり 2026-09-05 に廃止した）。
    environment:
      # LLM_FAST_MODEL / LLM_STANDARD_MODEL / LLM_DEEP_MODEL の行は削除した（2026-09-05）。
      # `${VAR:-o3-mini}` の既定値が Settings（core/config.py の gpt-5.x 系）を黙って
      # 上書きしていたため。旧名 OPENAI_FAST_MODEL の吸収と tier 間フォールバック
      # （standard ← LLM_ANALYSIS_MODEL / deep ← standard）は core/config.py の Settings
      # （AliasChoices + model_validator）へ移設済みで、.env の LLM_*_MODEL は env_file で
      # そのまま届く。compose には空でない既定を書けない（`${VAR}` は未設定時に空文字を渡す）。
      # ② DB_* から接続文字列を合成する（.env の DATABASE_URL より優先される）
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      # ① 認証ファイルパス: ホストの .gcp/ をコンテナ内 /app/.gcp/ にマウントした場合の固定パス。
      # .env で上書き可能 (例: GOOGLE_APPLICATION_CREDENTIALS=/app/.gcp/sa.json)
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/app/.gcp/application_default_credentials.json}
      # ① コンテナ間はサービス名で解決する（ホスト側の localhost:8070 とは別）
      GROBID_URL: ${GROBID_URL:-http://grobid:8070}
    # ローカルの .gcp/ をコンテナに読み取り専用でマウントする。
    # ファイルが存在しない場合は空ディレクトリとしてマウントされる（エラーにはならない）。
    # サービスアカウントキーを使う場合: .gcp/credentials.json に配置する。
    # gcloud ADC を使う場合: .gcp/application_default_credentials.json に配置し
    #   GOOGLE_APPLICATION_CREDENTIALS=/app/.gcp/application_default_credentials.json を .env に記載。
    volumes:
      - ./.gcp:/app/.gcp:ro
    # postgres への依存は docker-compose.local.yml 側で足す（ベースはマネージド DB 前提で
    # postgres サービスを持たないため、ここに書くと invalid compose project になる）。
    depends_on:
      minio:
        condition: service_started
      grobid:
        condition: service_started
    networks:
      - episteme
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api-server
    networks:
      - episteme

volumes:
  postgres_data:
  minio_data:

networks:
  episteme:
    driver: bridge
